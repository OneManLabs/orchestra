name: Orchestra CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:publication
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: core
            dockerfile: deploy/docker/core.Dockerfile
          - component: agent
            dockerfile: deploy/docker/agent.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: fleet-canvas/${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e sdks/python
      - run: python -m unittest discover -s sdks/python/tests -v
      - run: python -m compileall -q sdks/python/src
